name: Daily projections

on:
  schedule:
    # 13:30 UTC = 9:30am EDT / 8:30am EST, Oct-Jun. hoopR's release files
    # refresh around 11:30 UTC.
    - cron: "30 13 * 10-12,1-6 *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD). Blank = today (Eastern)."
        required: false
      backfill:
        description: "Rebuild every slate this season up to the date"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-projections
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::hoopR
            any::dplyr
            any::tibble
            any::jsonlite
            any::testthat

      - name: Unit tests
        run: Rscript pipeline/tests/run_tests.R

      - name: Run pipeline
        env:
          SLATE_DATE: ${{ inputs.date }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          ARGS=()
          if [ -n "$SLATE_DATE" ]; then ARGS+=("--date=$SLATE_DATE"); fi
          if [ "$BACKFILL" = "true" ]; then ARGS+=("--backfill"); fi
          Rscript pipeline/run.R "${ARGS[@]}"

      # Only reached if tests and the pipeline's sanity checks passed, so a
      # failed run leaves the previous day's data live.
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Projections $(TZ=America/New_York date +%F)"
            git push
          fi
