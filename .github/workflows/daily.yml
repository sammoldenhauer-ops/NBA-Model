name: Daily projections

on:
  schedule:
    # 13:30 UTC = 9:30am EDT / 8:30am EST, Oct-Jun. hoopR's release files
    # refresh around 11:30 UTC.
    - cron: "30 13 * 10-12,1-6 *"
  push:
    # Re-run the backtest and confidence calibration when the Model sheet is published.
    branches: [main]
    paths: [web/model.json]
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD). Blank = today (Eastern)."
        required: false
      backfill:
        description: "Rebuild every slate this season up to the date"
        type: boolean
        default: false
      retune:
        description: "Re-tune the weight schedule (normally Mondays)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-projections
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::hoopR
            any::dplyr
            any::tidyr
            any::tibble
            any::jsonlite
            any::testthat

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies (injury report PDFs)
        run: pip install pypdf

      - name: Archive DARKO's daily player board
        run: python pipeline/darko.py || echo "::warning::DARKO snapshot failed"

      - name: Unit tests
        run: Rscript pipeline/tests/run_tests.R

      - name: Run pipeline (stats, slates, betting lines, backtest inputs)
        env:
          SLATE_DATE: ${{ inputs.date }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          ARGS=()
          if [ -n "$SLATE_DATE" ]; then ARGS+=("--date=$SLATE_DATE"); fi
          if [ "$BACKFILL" = "true" ]; then ARGS+=("--backfill"); fi
          Rscript pipeline/run.R "${ARGS[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Re-tune weight schedule (Mondays)
        working-directory: web
        env:
          RETUNE: ${{ inputs.retune }}
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "${{ github.event_name }}" = "schedule" ] || [ "$RETUNE" = "true" ]; then
            npx tsx scripts/tune-weights.ts --write
          else
            echo "Not Monday; keeping the current schedule."
          fi

      - name: Backtest and calibrate confidence
        working-directory: web
        run: npx tsx scripts/confidence.ts

      # Only reached if every step above passed, so a failed run leaves the
      # previous data live.
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data pipeline/cache web/model.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Projections $(TZ=America/New_York date +%F)"
            git push
          fi
